# Builds the phone app (android/) to check that it compiles, whenever it
# changes. The app people install is built and signed by release.yml.
name: App

on:
  push:
    branches: [main]
    paths: [android/**, .github/workflows/app.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Build
        run: gradle -p android --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ledger-import-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
